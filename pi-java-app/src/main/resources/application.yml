# pi-java 基础配置。
# 默认使用 demo profile：H2 文件库 + Fake LLM，无需任何外部服务即可启动。
# 生产/联调通过 --spring.profiles.active=mysql 切换，密钥只允许来自环境变量。
spring:
  application:
    name: pi-java
  profiles:
    default: demo
  main:
    banner-mode: "off"
  datasource:
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
      connection-timeout: 10000
  flyway:
    enabled: true
    clean-disabled: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  web:
    resources:
      cache:
        cachecontrol:
          # 本地单机工具：静态资源始终回源，升级后浏览器不会继续用旧的 CSS/JS。
          no-store: true
  servlet:
    multipart:
      # 与应用服务里的单张 5 MB 限制保持一致。
      max-file-size: 5MB
      max-request-size: 6MB

server:
  address: "${PI_SERVER_ADDRESS:127.0.0.1}"
  port: 8080
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      force: true

# OpenAPI：/v3/api-docs 是 JSON 契约，/swagger-ui.html 提供本地调试页面。
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    # 可空参数显式绑定 NULL，避免 H2/MySQL 对 JdbcType.OTHER 的处理差异。
    jdbc-type-for-null: "NULL"

# 运行时参数。全部有安全默认值，后续里程碑由配置绑定逐步消费。
pi:
  version: "0.2.0"
  fake:
    # 默认回声；demo profile 下开启确定性指令脚本（/read、/ls）。
    demo-mode: false
  mcp:
    # MCP 服务器默认不启用；配置与示例见 docs/10-mcp.md。
    servers: []
  attachments:
    # 图片附件落盘目录；与 H2 文件库共用 PI_DATA_DIR，便于一起备份或迁移。
    dir: "${PI_DATA_DIR:./data}/attachments"
  git:
    # 运行前后快照与逐轮 diff；工作区不是 Git 仓库时自动跳过。
    enabled: true
    timeout-seconds: 10
    max-diff-chars: 60000
  verify:
    # 自动验证命令；留空表示关闭。示例：mvn -q test 或 npm test。
    # 也可用环境变量 PI_VERIFY_COMMAND 临时启用。
    command: "${PI_VERIFY_COMMAND:}"
    timeout-seconds: 120
    max-output-chars: 6000
    # 失败后把输出回写一次，让模型在同一 run 内修复。
    retry-on-failure: true
  agent:
    max-concurrent-runs: 4
    tool-parallelism: 4
    approval-ttl: 30m
    max-subagent-depth: 2
    context:
      reserve-tokens: 16384
      keep-recent-tokens: 20000
    skills:
      # 用户目录优先（同名覆盖内置版本），内置目录兜底随 jar 分发。
      - "~/.pi-java/skills"
      - "classpath:skills"

logging:
  level:
    root: INFO
    com.piagent: INFO

---
# 本地演示：文件型 H2 落在 ./data，重启后会话仍在；schema 由 Flyway 管理。
spring:
  config:
    activate:
      on-profile: demo
  datasource:
    url: "jdbc:h2:file:${PI_DATA_DIR:./data}/pi-java;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE"
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    locations: classpath:db/migration/h2

pi:
  fake:
    demo-mode: true

---
# MySQL 8：连接信息全部通过环境变量注入，仓库与镜像中不出现密码。
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: "${PI_MYSQL_URL:jdbc:mysql://localhost:3306/pi_java?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}"
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: "${PI_MYSQL_USER:pi}"
    password: "${PI_MYSQL_PASSWORD:}"
  flyway:
    locations: classpath:db/migration/mysql
