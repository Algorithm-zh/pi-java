name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_ARGS: -B -ntp

jobs:
  verify:
    name: Maven verify (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn $MAVEN_ARGS verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          retention-days: 7

  docker:
    name: Docker image and container smoke
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: pi-java:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start container
        run: |
          docker run -d --name pi-java-ci -p 127.0.0.1:18080:8080 pi-java:ci
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/api/v1/system/info > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "container did not become ready"
          docker logs pi-java-ci
          exit 1
      - name: Smoke test API, OpenAPI and UI
        run: |
          python3 -c "import json,urllib.request as u; info=json.load(u.urlopen('http://127.0.0.1:18080/api/v1/system/info')); assert info['version']=='0.2.0', info; doc=json.load(u.urlopen('http://127.0.0.1:18080/v3/api-docs')); assert '/api/v1/sessions/{id}/plan' in doc['paths']; page=u.urlopen('http://127.0.0.1:18080/').read().decode(); assert 'pi-java' in page; print('container smoke ok')"
      - name: Container logs
        if: always()
        run: docker logs pi-java-ci || true
      - name: Stop container
        if: always()
        run: docker rm -f pi-java-ci || true

  mysql:
    name: MySQL profile smoke
    runs-on: ubuntu-latest
    needs: verify
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: pi_java
          MYSQL_USER: pi
          MYSQL_PASSWORD: pi-ci
          MYSQL_ROOT_PASSWORD: root-ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Package application
        run: mvn $MAVEN_ARGS -DskipTests -pl pi-java-app -am package
      - name: Start application on MySQL
        env:
          PI_MYSQL_URL: "jdbc:mysql://127.0.0.1:3306/pi_java?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true"
          PI_MYSQL_USER: pi
          PI_MYSQL_PASSWORD: pi-ci
        run: |
          JAR=$(ls pi-java-app/target/pi-java-app-*.jar | grep -v '\.original$' | head -1)
          # demo 在前负责种子数据（fake-demo 模型），mysql 在后覆盖数据源。
          nohup java -jar "$JAR" --spring.profiles.active=demo,mysql > /tmp/pi-java-mysql.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/v1/system/info > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "application did not become ready"
          cat /tmp/pi-java-mysql.log
          exit 1
      - name: Create and read a session through MySQL
        run: |
          python3 -c "import json,urllib.request as u; body={'title':'ci','cwd':'/tmp','modelProfileId':'fake-demo'}; req=u.Request('http://127.0.0.1:8080/api/v1/sessions', data=json.dumps(body).encode(), headers={'Content-Type':'application/json'}, method='POST'); created=json.load(u.urlopen(req)); assert created['id'], created; sessions=json.load(u.urlopen('http://127.0.0.1:8080/api/v1/sessions?cwd=/tmp')); assert any(item['id']==created['id'] for item in sessions), sessions; print('mysql smoke ok', created['id'])"
      - name: Application log
        if: always()
        run: cat /tmp/pi-java-mysql.log || true
